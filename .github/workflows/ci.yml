name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build va testlar uchun soxta qiymatlar — haqiqiy sirlar Vercel'da
      AUTH_SECRET: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: O'rnatish
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # Testlar o'zi PGlite (xotiradagi Postgres) ko'taradi va migratsiyalarni qo'llaydi
      - name: Testlar
        run: npm test

      - name: Production build
        run: npx next build
